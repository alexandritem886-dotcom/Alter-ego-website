<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Customizer — ALTER EGO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    .customizer-layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 3rem;
      padding: 3rem 6% 6rem;
      align-items: start;
    }
    .preview-box {
      background: #FFF;
      border-radius: 24px;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.04);
      border: 1px solid rgba(45,58,52,0.1);
    }
    .preview-box img {
      max-height: 380px;
      object-fit: contain;
      transition: filter 0.5s ease;
    }
    .controls-panel {
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 24px;
      border: 1px solid rgba(45,58,52,0.1);
    }
    .option-group {
      margin-bottom: 2rem;
    }
    .option-group label {
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      font-weight: 700;
      display: block;
      margin-bottom: 0.8rem;
    }
    .color-swatches {
      display: flex;
      gap: 12px;
    }
    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .swatch.active {
      border-color: var(--color-charcoal);
      transform: scale(1.15);
    }
  </style>
</head>
<body>

  <header class="floating-nav">
    <a href="index.html" class="brand-logo">
      <span class="logo-mark">ae</span>
      <span class="logo-text">alter ego</span>
    </a>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="shop.html">Collection</a>
      <a href="customizer.html" class="active">Customizer</a>
      <a href="story.html">Our Story</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="cart-trigger" id="cartBtn">
        CART <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="customizer-layout">
    
    <div class="preview-box">
      <span class="card-badge" style="position: absolute; top: 20px; left: 20px;">LIVE PREVIEW</span>
      <img id="customItemPreview" src="bag.jpeg" alt="Customizer Model">
      <div style="position: absolute; bottom: 20px; text-align: center; font-size: 0.8rem; color: var(--color-slate-gray);">
        &bull; 3D Print Material: SLA Precision Poly-Resin
      </div>
    </div>

    <div class="controls-panel">
      <span class="subtext">TAILOR YOUR PIECE</span>
      <h1 style="font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 1.5rem;">STUDIO CUSTOMIZER</h1>

      <div class="option-group">
        <label>1. SELECT COLOR FINISH</label>
        <div class="color-swatches">
          <div class="swatch active" style="background: #2D3A34;" onclick="changeColor('#2D3A34', this)" title="Charcoal"></div>
          <div class="swatch" style="background: #D07A4A;" onclick="changeColor('#D07A4A', this)" title="Terracotta"></div>
          <div class="swatch" style="background: #E9B5A7;" onclick="changeColor('#E9B5A7', this)" title="Dusty Rose"></div>
          <div class="swatch" style="background: #A3A3A3;" onclick="changeColor('#A3A3A3', this)" title="Slate Gray"></div>
        </div>
      </div>

      <div class="option-group">
        <label>2. SELECT SIZING FIT</label>
        <div style="display: flex; gap: 10px;">
          <button class="filter-chip active" style="flex: 1;" onclick="changeSize(this)">SMALL</button>
          <button class="filter-chip" style="flex: 1;" onclick="changeSize(this)">MEDIUM</button>
          <button class="filter-chip" style="flex: 1;" onclick="changeSize(this)">LARGE</button>
        </div>
      </div>

      <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid rgba(45,58,52,0.15);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <span style="font-weight: 700;">CUSTOM PIECE PRICE</span>
          <span style="font-size: 1.5rem; color: var(--color-terracotta); font-weight: 700;">₦25k</span>
        </div>
        <button class="btn-primary" style="width: 100%; text-align: center;" onclick="addToCart('Customized 3D Wearable')">PRINT MY ALTER EGO</button>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
  <script>
    let customizerState = {
      color: '#2D3A34',
      size: 'SMALL'
    };

    const colorMap = {
      '#2D3A34': 'charcoal',
      '#D07A4A': 'terracotta',
      '#E9B5A7': 'rose',
      '#A3A3A3': 'gray'
    };

    function changeColor(colorHex, swatchEl) {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      swatchEl.classList.add('active');
      customizerState.color = colorHex;
      updatePreview();
    }

    function changeSize(sizeBtn) {
      document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
      sizeBtn.classList.add('active');
      customizerState.size = sizeBtn.textContent;
      updatePreview();
    }

    function updatePreview() {
      const preview = document.getElementById('customItemPreview');
      const colorName = colorMap[customizerState.color] || 'charcoal';
      const sizeClass = customizerState.size.toLowerCase();
      preview.style.filter = `hue-rotate(${getHueRotation(customizerState.color)}deg)`;
      preview.style.opacity = '1';
      preview.style.transition = 'filter 0.5s ease';
    }

    function getHueRotation(colorHex) {
      const hueMap = {
        '#2D3A34': 0,
        '#D07A4A': 25,
        '#E9B5A7': 10,
        '#A3A3A3': 0
      };
      return hueMap[colorHex] || 0;
    }
  </script>
</body>
</html>
