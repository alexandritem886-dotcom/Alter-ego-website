<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — ALTER EGO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 600px;
      margin: 0 auto;
      background: #FFF;
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.03);
    }
    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 1rem;
      border: 1px solid rgba(45,58,52,0.2);
      border-radius: 12px;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <header class="floating-nav">
    <a href="index.html" class="brand-logo">
      <span class="logo-mark">ae</span>
      <span class="logo-text">alter ego</span>
    </a>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="shop.html">Collection</a>
      <a href="customizer.html">Customizer</a>
      <a href="story.html">Our Story</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="cart-trigger" id="cartBtn">
        CART <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main style="padding: 4rem 6% 6rem;">
    <div style="text-align: center; margin-bottom: 3rem;">
      <span class="subtext">GET IN TOUCH</span>
      <h1 style="font-family: var(--font-heading); font-size: 3.5rem;">CONNECT WITH US</h1>
    </div>

    <form class="contact-form" onsubmit="event.preventDefault(); alert('Message Sent!');">
      <div>
        <label style="font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 0.5rem;">YOUR NAME</label>
        <input type="text" placeholder="Enter your full name" required>
      </div>
      <div>
        <label style="font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 0.5rem;">EMAIL ADDRESS</label>
        <input type="email" placeholder="name@domain.com" required>
      </div>
      <div>
        <label style="font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 0.5rem;">MESSAGE</label>
        <textarea rows="5" placeholder="Inquire about custom prints or collaborations..." required></textarea>
      </div>
      <button type="submit" class="btn-primary" style="cursor: pointer; border: none;">SEND TRANSMISSION</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
